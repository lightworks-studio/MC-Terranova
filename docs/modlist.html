<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod List — Terranova</title>
  <meta name="description" content="Full list of mods included in the Terranova Minecraft modpack.">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero" style="min-height: 260px;">
    <div class="hero-inner">
      <img class="logo" src="assets/icon.png" alt="Terranova icon">
      <h1>Mod List</h1>
      <p class="tagline">Every mod shipped with Terranova.</p>
    </div>
  </header>

  <nav>
    <div class="nav-inner">
      <a href="index.html">Home</a>
      <a href="index.html#download">Download</a>
      <a href="index.html#install">Install</a>
      <a href="modlist.html" class="active">Mod List</a>
      <a href="https://www.createmodservers.com/server/b5ca53d7" target="_blank" rel="noopener">Server</a>
    </div>
  </nav>

  <main>

    <section>
      <h2>Included Mods</h2>
      <div class="modlist-tools">
        <input type="search" id="mod-search" placeholder="Search mods…" autocomplete="off" autofocus>
      </div>
      <p class="mod-count"><span id="mod-count">…</span> mods</p>

      <ul class="mod-grid" id="mod-grid">
        <li class="mod-loading">Loading mod list…</li>
      </ul>
    </section>

  </main>

  <footer>
    <p>Terranova is not affiliated with Mojang or Microsoft. Minecraft is a trademark of Mojang AB.</p>
    <p>Source on <a href="https://github.com/lightworks-studio/MC-Terranova" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script>
    const search = document.getElementById("mod-search");
    const grid = document.getElementById("mod-grid");
    const countEl = document.getElementById("mod-count");
    let items = [];

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      let visible = 0;
      for (const li of items) {
        const match = (li.dataset.name || "").includes(q);
        li.classList.toggle("hidden", !match);
        if (match) visible++;
      }
      countEl.textContent = visible;
    }

    search.addEventListener("input", applyFilter);

    async function loadMods() {
      try {
        const res = await fetch("modlist.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const mods = await res.json();

        const seen = new Set();
        const frag = document.createDocumentFragment();

        for (const mod of mods) {
          if (!mod || !mod.name || seen.has(mod.name)) continue;
          seen.add(mod.name);

          const li = document.createElement("li");
          li.dataset.name = mod.name.toLowerCase();

          if (mod.url) {
            const a = document.createElement("a");
            a.href = mod.url;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = mod.name;
            li.appendChild(a);
          } else {
            const span = document.createElement("span");
            span.className = "no-link";
            span.textContent = mod.name;
            li.appendChild(span);
          }

          const authors = Array.isArray(mod.authors) ? mod.authors.join(", ") : "";
          const meta = [mod.version, authors].filter(Boolean).join(" · ");
          if (meta) {
            const m = document.createElement("div");
            m.className = "mod-meta";
            m.textContent = meta;
            li.appendChild(m);
          }

          frag.appendChild(li);
        }

        grid.replaceChildren(frag);
        items = Array.from(grid.children);
        applyFilter();
      } catch (err) {
        const li = document.createElement("li");
        li.className = "mod-error";
        li.textContent = "Couldn't load modlist.json (" + err.message + ") — reload the page to try again.";
        grid.replaceChildren(li);
        items = [];
        countEl.textContent = "—";
      }
    }

    loadMods();
  </script>

</body>
</html>
